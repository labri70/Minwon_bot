<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>삼성생명 민원 지식봇</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              samsung: "#0d63c9",
              ink: "#172033",
              mist: "#f4f7fb",
              coral: "#ff6b6b",
              mint: "#35c6a4",
            },
            boxShadow: {
              soft: "0 14px 36px rgba(23, 32, 51, 0.12)",
            },
          },
        },
      };
    </script>
    <script src="./config.local.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="min-h-screen bg-[#eef3f9] text-ink">
    <main class="mx-auto flex min-h-screen max-w-[430px] flex-col bg-white shadow-soft">
      <header class="sticky top-0 z-10 border-b border-slate-100 bg-white/95 backdrop-blur">
        <div class="flex h-14 items-center gap-3 px-4">
          <button class="grid h-9 w-9 place-items-center rounded-full text-slate-700 hover:bg-slate-100" aria-label="뒤로가기">
            <i data-lucide="chevron-left" class="h-5 w-5"></i>
          </button>
          <div class="min-w-0 flex-1">
            <h1 class="truncate text-[17px] font-extrabold tracking-normal">삼성생명 민원 지식봇</h1>
            <p class="text-xs font-medium text-slate-500">공개 FAQ 기반 참고용</p>
          </div>
          <button id="resetButton" class="grid h-9 w-9 place-items-center rounded-full text-slate-700 hover:bg-slate-100" aria-label="초기화">
            <i data-lucide="rotate-cw" class="h-4 w-4"></i>
          </button>
        </div>
      </header>

      <section id="chatLog" class="flex-1 space-y-5 overflow-y-auto px-4 pb-32 pt-5">
        <div class="text-center text-xs font-semibold text-slate-400">2026-08-03</div>

        <div class="flex gap-2">
          <div class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-[#6c63ff] text-white">
            <i data-lucide="bot" class="h-5 w-5"></i>
          </div>
          <div class="max-w-[82%]">
            <p class="mb-1 text-xs font-bold text-slate-600">삼성생명 민원 지식봇</p>
            <div class="rounded-2xl rounded-tl-md bg-mist px-4 py-3 text-[14px] leading-6 text-slate-800">
              안녕하세요. 민원 FAQ를 근거로 참고용 답변을 도와드릴게요.
            </div>
          </div>
        </div>

        <div class="flex gap-2">
          <div class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-white text-slate-400 ring-1 ring-slate-200">
            <i data-lucide="volume-2" class="h-4 w-4"></i>
          </div>
          <div class="max-w-[82%] rounded-2xl rounded-tl-md bg-[#f7f8fb] px-4 py-3 text-[13px] leading-6 text-slate-600">
            금액, 환급금, 한도, 확정 판단은 담당자 확인이 필요합니다.
          </div>
        </div>
      </section>

      <form id="questionForm" class="fixed bottom-0 left-1/2 z-20 w-full max-w-[430px] -translate-x-1/2 border-t border-slate-100 bg-white/95 px-3 pb-4 pt-3 backdrop-blur">
        <div id="inlineNotice" class="mb-2 hidden rounded-xl border border-coral/30 bg-coral/10 px-3 py-2 text-xs font-semibold text-coral"></div>
        <div class="flex items-end gap-2 rounded-full bg-[#f4f5f7] p-2 ring-1 ring-slate-200">
          <input
            id="questionInput"
            class="min-h-10 flex-1 bg-transparent px-3 text-[15px] outline-none placeholder:text-slate-400"
            type="text"
            autocomplete="off"
            placeholder="민원 내용을 입력하세요."
            aria-label="민원 질문 입력"
          />
          <button id="askButton" class="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-samsung text-white transition hover:bg-blue-700 disabled:bg-slate-300" type="submit" aria-label="질문하기">
            <i data-lucide="send" class="h-4 w-4"></i>
          </button>
        </div>
      </form>
    </main>

    <script type="module">
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

      const config = window.MINWON_BOT_CONFIG || {};
      const supabaseUrl = config.supabaseUrl || "";
      const supabasePublishableKey = config.supabasePublishableKey || "";
      const supabase =
        supabaseUrl && supabasePublishableKey
          ? createClient(supabaseUrl, supabasePublishableKey, {
              auth: { persistSession: false },
              db: { retry: false },
            })
          : null;

      const chatLog = document.querySelector("#chatLog");
      const form = document.querySelector("#questionForm");
      const input = document.querySelector("#questionInput");
      const askButton = document.querySelector("#askButton");
      const resetButton = document.querySelector("#resetButton");
      const inlineNotice = document.querySelector("#inlineNotice");

      const ESCALATION_TERMS = ["금액", "환급", "환급금", "한도", "결제일", "지급", "확정", "얼마"];
      const AMBIGUOUS_SCORE = 0.18;
      const MIN_CATEGORY_RESULTS = 5;
      const LOCAL_SERVER_URL = "http://127.0.0.1:4173/index.html";

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function hasPrivateNumber(text) {
        const digitsOnly = text.replace(/\D/g, "");
        const longNumber = /\d[\d\s-]{7,}\d/.test(text);
        const rrnLike = /\d{6}\s*-?\s*\d{7}/.test(text);
        const phoneLike = /01[016789]\s*-?\s*\d{3,4}\s*-?\s*\d{4}/.test(text);
        return digitsOnly.length >= 9 || longNumber || rrnLike || phoneLike;
      }

      function needsEscalation(text) {
        return ESCALATION_TERMS.some((term) => text.includes(term));
      }

      function setNotice(message) {
        inlineNotice.textContent = message;
        inlineNotice.classList.toggle("hidden", !message);
      }

      function isFileOpen() {
        return window.location.protocol === "file:";
      }

      function scrollToBottom() {
        requestAnimationFrame(() => {
          chatLog.scrollTop = chatLog.scrollHeight;
        });
      }

      function addUserMessage(text) {
        chatLog.insertAdjacentHTML(
          "beforeend",
          `<div class="flex justify-end">
            <div class="max-w-[82%] rounded-2xl rounded-tr-md bg-samsung px-4 py-3 text-[14px] leading-6 text-white">
              ${escapeHtml(text)}
            </div>
          </div>`
        );
        scrollToBottom();
      }

      function addBotMessage(html, id = "") {
        const wrapper = document.createElement("div");
        wrapper.className = "flex gap-2";
        if (id) wrapper.id = id;
        wrapper.innerHTML = `
          <div class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-[#6c63ff] text-white">
            <i data-lucide="bot" class="h-5 w-5"></i>
          </div>
          <div class="max-w-[84%]">${html}</div>
        `;
        chatLog.appendChild(wrapper);
        lucide.createIcons();
        scrollToBottom();
        return wrapper;
      }

      function addLoading() {
        return addBotMessage(
          `<p class="mb-1 text-xs font-bold text-slate-600">검색 중</p>
          <div class="rounded-2xl rounded-tl-md bg-mist px-4 py-3 text-[14px] leading-6 text-slate-700">
            관련 FAQ를 찾고 있어요<span class="inline-flex w-6 animate-pulse justify-end">...</span>
          </div>`,
          "loadingMessage"
        );
      }

      function buildResultHtml({ category, ambiguous, faqs, escalated, expandedSearch, answer }) {
        const categoryText = category?.category || "예측 어려움";
        const score = typeof category?.score === "number" ? category.score.toFixed(3) : "-";
        const badgeClass = ambiguous ? "bg-coral/10 text-coral ring-coral/30" : "bg-mint/10 text-emerald-700 ring-mint/30";
        const statusText = escalated ? "담당자 확인 필요" : "참고용 답변";

        const faqHtml =
          faqs.length > 0
            ? faqs
                .map(
                  (faq, index) => `
                    <article class="rounded-2xl bg-white p-3 ring-1 ring-slate-200">
                      <div class="mb-2 flex items-center justify-between gap-2">
                        <span class="rounded-full bg-samsung/10 px-2 py-1 text-[11px] font-extrabold text-samsung">FAQ #${escapeHtml(faq.id || index + 1)}</span>
                        <span class="truncate text-[11px] font-bold text-slate-500">${escapeHtml(faq.category || "")}</span>
                      </div>
                      <p class="text-[13px] font-extrabold leading-5 text-slate-900">${escapeHtml(faq.question || "")}</p>
                      <p class="mt-2 text-[13px] leading-5 text-slate-600">${escapeHtml(faq.answer || "")}</p>
                    </article>`
                )
                .join("")
            : `<div class="rounded-2xl bg-white px-4 py-4 text-center text-[14px] font-extrabold text-slate-600 ring-1 ring-slate-200">관련 FAQ 없음</div>`;

        return `
          <p class="mb-1 text-xs font-bold text-slate-600">삼성생명 민원 지식봇</p>
          <div class="space-y-3 rounded-2xl rounded-tl-md bg-mist px-4 py-4">
            <div class="flex flex-wrap items-center gap-2">
              <span class="rounded-full px-2.5 py-1 text-[11px] font-extrabold ring-1 ${badgeClass}">
                카테고리: ${escapeHtml(categoryText)}
              </span>
              <span class="rounded-full bg-white px-2.5 py-1 text-[11px] font-bold text-slate-500 ring-1 ring-slate-200">
                신뢰도 ${escapeHtml(score)}
              </span>
              <span class="rounded-full ${escalated ? "bg-coral text-white" : "bg-samsung text-white"} px-2.5 py-1 text-[11px] font-extrabold">
                ${statusText}
              </span>
            </div>
            <div class="rounded-2xl bg-white px-4 py-3 text-[14px] leading-6 text-slate-800 ring-1 ring-slate-200">
              ${escapeHtml(answer || "잠시후다시")}
            </div>
            <div class="flex items-center justify-between gap-2">
              <h2 class="text-[13px] font-extrabold text-slate-800">참고한 FAQ</h2>
              <span class="rounded-full bg-white px-2.5 py-1 text-[11px] font-bold text-slate-500 ring-1 ring-slate-200">
                ${expandedSearch ? "전체 FAQ 재검색 포함" : "예측 카테고리 우선"}
              </span>
            </div>
            <div class="space-y-2">${faqHtml}</div>
          </div>`;
      }

      async function predictCategory(question) {
        const { data, error } = await supabase.rpc("predict_faq_category", {
          search_query: question,
          match_limit: 3,
        });
        if (error) throw error;
        return data || [];
      }

      async function searchFaqs(question, category = null) {
        const { data, error } = await supabase.rpc("search_faqs", {
          search_query: question,
          category_filter: category,
          match_limit: 5,
        });
        if (error) throw error;
        return data || [];
      }

      async function createAnswer(question, faqs) {
        if (isFileOpen()) {
          throw new Error("file_protocol");
        }
        const response = await fetch("/api/answer", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, faqs }),
        });
        const data = await response.json().catch(() => ({ answer: "잠시후다시" }));
        return data.answer || "잠시후다시";
      }

      async function handleQuestion(question) {
        const loading = addLoading();
        askButton.disabled = true;

        try {
          if (isFileOpen()) {
            throw new Error("file_protocol");
          }

          if (!supabase) {
            throw new Error("Supabase config is missing.");
          }

          const categoryCandidates = await predictCategory(question);
          const topCategory = categoryCandidates[0] || null;
          const secondCategory = categoryCandidates[1] || null;
          const ambiguous =
            !topCategory ||
            topCategory.score < AMBIGUOUS_SCORE ||
            (secondCategory && topCategory.score - secondCategory.score < 0.04);

          let faqs = [];
          if (topCategory && !ambiguous) {
            faqs = await searchFaqs(question, topCategory.category);
          }

          if (ambiguous || faqs.length < MIN_CATEGORY_RESULTS) {
            var expandedSearch = true;
            const allFaqs = await searchFaqs(question, null);
            const merged = [...faqs, ...allFaqs];
            const byId = new Map();
            merged.forEach((faq) => byId.set(faq.id, faq));
            faqs = [...byId.values()]
              .sort((a, b) => Number(b.score || 0) - Number(a.score || 0))
              .slice(0, 5);
          }

          const answer = await createAnswer(question, faqs);

          loading.remove();
          addBotMessage(
            buildResultHtml({
              category: topCategory,
              ambiguous,
              faqs,
              escalated: needsEscalation(question),
              expandedSearch: Boolean(expandedSearch),
              answer,
            })
          );
        } catch (error) {
          loading.remove();
          const message =
            error?.message === "file_protocol"
              ? `이 화면은 파일로 직접 열면 검색과 답변 생성이 막힙니다. 로컬 서버 주소로 다시 열어주세요: ${LOCAL_SERVER_URL}`
              : "검색 중 오류가 발생했습니다. 담당자 확인이 필요합니다.";
          addBotMessage(
            `<p class="mb-1 text-xs font-bold text-slate-600">삼성생명 민원 지식봇</p>
            <div class="rounded-2xl rounded-tl-md bg-coral/10 px-4 py-3 text-[14px] font-semibold leading-6 text-coral ring-1 ring-coral/30">
              ${escapeHtml(message)}
            </div>`
          );
        } finally {
          askButton.disabled = false;
          input.focus();
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const question = input.value.trim();
        setNotice("");

        if (!question) {
          setNotice("질문을 먼저 입력해주세요.");
          return;
        }

        if (hasPrivateNumber(question)) {
          setNotice("개인정보로 보이는 숫자는 입력할 수 없습니다.");
          return;
        }

        addUserMessage(question);
        input.value = "";
        handleQuestion(question);
      });

      input.addEventListener("input", () => {
        if (!input.value.trim()) {
          setNotice("");
          return;
        }
        if (hasPrivateNumber(input.value)) {
          setNotice("개인정보로 보이는 숫자는 입력할 수 없습니다.");
        } else {
          setNotice("");
        }
      });

      resetButton.addEventListener("click", () => {
        location.reload();
      });

      if (isFileOpen()) {
        setNotice(`파일로 직접 열면 API가 막힙니다. ${LOCAL_SERVER_URL} 로 열어주세요.`);
      }

      lucide.createIcons();
    </script>
  </body>
</html>
